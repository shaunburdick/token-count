[package]
name = "token-count"
version = "0.1.0"
authors = ["Shaun Burdick <shaun.burdick@gmail.com>"]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "Count tokens for LLM models using exact tokenization"
repository = "https://github.com/shaunburdick/token-count"
keywords = ["tokenizer", "llm", "gpt", "cli", "tokens"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tiktoken-rs = "0.9.1"
anyhow = "1.0.102"
thiserror = "1.0"
strsim = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
assert_cmd = "2.0"
predicates = "3.0"

[[bench]]
name = "tokenization"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1

[lib]
name = "token_count"
path = "src/lib.rs"

[[bin]]
name = "token-count"
path = "src/main.rs"
